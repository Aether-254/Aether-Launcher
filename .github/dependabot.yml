version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      frontend-minor:
        update-types:
          - minor
          - patch
    ignore:
      # typescript-eslint 8.72 currently requires TypeScript < 6.1.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
      - "area: frontend"
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      rust-minor:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - "area: rust"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - "area: ci"
