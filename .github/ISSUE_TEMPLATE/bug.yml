name: Bug report
description: 报告可复现的软件缺陷
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢报告。请删除 token、账户标识和个人目录等敏感信息，并区分“构建成功”和“实际运行成功”。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我搜索过现有 Issues 和 Discussions，没有找到同一问题
          required: true
        - label: 我使用的是本仓库发布或自行构建的 Aether Launcher
          required: true
        - label: 日志已经移除凭据、token 与个人信息
          required: true
  - type: input
    id: version
    attributes:
      label: Aether 版本或提交
      placeholder: v0.1.0 或完整 commit SHA
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 11
        - Windows 10
        - Linux
        - macOS
        - 其他
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 从干净状态开始，逐步列出操作
      placeholder: |
        1. 打开...
        2. 选择...
        3. 出现...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为与完整错误
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏日志
      description: 可拖入日志文件；不要粘贴账号 token
      render: text
  - type: textarea
    id: context
    attributes:
      label: 其他上下文
      description: Java 版本、实例类型、模组加载器、网络环境、截图等
